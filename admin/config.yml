# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: jihyuncraft/jihyuncraft.github.io
  branch: main

# 이미지 폴더 (기존 사진들이 편집화면에 그림으로 보이도록 images 전체를 지정)
media_folder: images
public_folder: /images

# 관리 화면 UI 한국어
locale: ko

collections:
  - name: content
    label: 홈페이지 내용
    files:
      # ---------- 하나의 파일(site.json)을 항목별로 편집 ----------
      - name: site
        label: 사이트 내용
        file: content/site.json
        fields:
          # ===== 메인 (홈 슬라이드) =====
          - label: 메인 (홈 슬라이드 사진)
            name: home
            widget: object
            collapsed: true
            fields:
              - label: 슬라이드 사진
                name: images
                widget: list
                label_singular: 사진
                field: { label: 사진, name: image, widget: image }

          # ===== 작품 (WORKS) =====
          - label: 작품 (WORKS)
            name: works
            widget: object
            collapsed: true
            fields:
              - label: OBJECTS
                name: objects
                widget: list
                label_singular: 작품
                summary: '{{fields.title}}'
                fields: &workfields
                  - { label: 대표 사진, name: img, widget: image }
                  - label: 추가 사진 (누르면 옆으로 넘겨 보는 사진)
                    name: images
                    widget: list
                    required: false
                    label_singular: 사진
                    field: { label: 사진, name: image, widget: image }
                  - { label: 작품명, name: title, widget: string, required: false }
                  - { label: 재료, name: mat, widget: string, required: false }
                  - { label: 크기, name: size, widget: string, required: false }
                  - { label: 연도, name: year, widget: string, required: false }
                  - { label: 설명, name: desc, widget: text, required: false }
              - label: HAP SERIES
                name: hap
                widget: list
                label_singular: 작품
                summary: '{{fields.title}}'
                fields: *workfields
              - label: TANGRAM SERIES
                name: tangram
                widget: list
                label_singular: 작품
                summary: '{{fields.title}}'
                fields: *workfields

          # ===== 전시 (EXHIBITIONS) — 데이터 이름은 예전 그대로 news =====
          - label: 전시 (EXHIBITIONS)
            name: news
            widget: object
            collapsed: true
            fields:
              - label: 전시 목록
                name: items
                widget: list
                label_singular: 전시
                summary: '{{fields.title}}'
                fields:
                  - { label: 구분, name: type, widget: select, options: [개인전, 단체전, 아트페어, 기타], default: 단체전 }
                  - { label: 연도, name: year, widget: string, required: false, hint: 비우면 전시일의 연도를 씁니다. 목록은 연도가 최근인 순서로 정렬됩니다. }
                  - { label: 대표 이미지 (목록·상세 맨 위), name: cover, widget: image, required: false, hint: 비우면 전시 전경 첫 사진을 씁니다. 목록에서는 3:2 비율로 잘려 보입니다. }
                  - { label: 포스터, name: poster, widget: image, required: false }
                  - { label: 전시명 (국문), name: title, widget: string }
                  - { label: 전시명 (영문), name: titleEn, widget: string, required: false }
                  - { label: 부제, name: sub, widget: string, required: false }
                  - { label: 전시일, name: period, widget: string, required: false }
                  - { label: 휴무, name: closed, widget: string, required: false }
                  - { label: 관람시간, name: hours, widget: string, required: false }
                  - { label: 전시장, name: venue, widget: string, required: false }
                  - { label: 목록에 보일 장소, name: place, widget: string, required: false, hint: '예: 갤러리 완물, 서울. 비우면 전시장을 그대로 씁니다.' }
                  - { label: 소개 글 (한국어), name: text, widget: text, required: false }
                  - { label: 소개 글 (영문), name: textEn, widget: text, required: false, hint: 채우면 소개 글 아래에 KR / EN 버튼이 생깁니다. EN을 누르면 아래 영문 칸들도 함께 바뀌고, 비워 둔 칸은 한국어 그대로 보입니다. }
                  - { label: 부제 (영문), name: subEn, widget: string, required: false }
                  - { label: 전시일 (영문), name: periodEn, widget: string, required: false }
                  - { label: 휴무 (영문), name: closedEn, widget: string, required: false }
                  - { label: 관람시간 (영문), name: hoursEn, widget: string, required: false }
                  - { label: 전시장 (영문), name: venueEn, widget: string, required: false }
                  - label: 전시 전경 사진
                    name: photos
                    widget: list
                    label_singular: 사진
                    field: { label: 사진, name: photo, widget: image }
                  - label: 작품 이미지 (선택 · 작은 사각 액자와 캡션)
                    name: works
                    widget: list
                    required: false
                    label_singular: 작품
                    summary: '{{fields.cap}}'
                    hint: 비워 두면 전시 전경 사진만 보입니다. 채우면 전경 사진 사이에 두 장씩 작게 들어갑니다.
                    fields:
                      - { label: 사진, name: img, widget: image }
                      - { label: 캡션, name: cap, widget: text, required: false }

          # ===== 소개 (ABOUT) =====
          - label: 소개 (ABOUT)
            name: about
            widget: object
            collapsed: true
            fields:
              - { label: 작업실 이미지 (한글), name: imageKo, widget: image }
              - { label: 작업실 이미지 (영문), name: imageEn, widget: image }
              - label: 이력 (CV)
                name: cv
                widget: object
                fields:
                  - label: 한글
                    name: ko
                    widget: object
                    fields:
                      - { label: 작가노트, name: statement, widget: text, required: false, hint: 사진과 이력 사이에 보입니다. 빈 줄로 문단을 나눕니다. }
                      - label: 개인전
                        name: solo
                        widget: list
                        label_singular: 이력
                        summary: '{{fields.year}} {{fields.text}}'
                        fields: &cvfields
                          - { label: 연도, name: year, widget: number, value_type: int }
                          - { label: 내용, name: text, widget: string }
                      - label: 단체전
                        name: group
                        widget: list
                        label_singular: 이력
                        summary: '{{fields.year}} {{fields.text}}'
                        fields: *cvfields
                      - label: 수상
                        name: awards
                        widget: list
                        label_singular: 이력
                        summary: '{{fields.year}} {{fields.text}}'
                        fields: *cvfields
                  - label: 영문 (English)
                    name: en
                    widget: object
                    fields:
                      - { label: Artist Note (English), name: statement, widget: text, required: false }
                      - label: Solo Exhibitions
                        name: solo
                        widget: list
                        label_singular: entry
                        summary: '{{fields.year}} {{fields.text}}'
                        fields: *cvfields
                      - label: Group Exhibitions
                        name: group
                        widget: list
                        label_singular: entry
                        summary: '{{fields.year}} {{fields.text}}'
                        fields: *cvfields
                      - label: Award
                        name: awards
                        widget: list
                        label_singular: entry
                        summary: '{{fields.year}} {{fields.text}}'
                        fields: *cvfields

          # ===== 설정 (연락처) =====
          - label: 설정 (연락처)
            name: settings
            widget: object
            collapsed: true
            fields:
              - { label: 이메일 아이디 (@앞), name: emailUser, widget: string }
              - { label: 이메일 도메인 (@뒤), name: emailDomain, widget: string }
              - { label: 인스타 표시 (@아이디), name: instaHandle, widget: string }
              - { label: 인스타 링크 (주소), name: insta, widget: string }
