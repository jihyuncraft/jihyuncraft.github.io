<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIM JI HYUN — 금속공예</title>
<meta name="description" content="KIM JI HYUN 김지현 — 금속공예 작가. Objects, Hap Series, Tangram Series.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>document.documentElement.classList.add('js')</script>
<style>
:root{
  --bg:#fff;
  --ink:#1a1a1a;
  --soft:#4d4d4d;
  --mute:#767676;          /* 흰 바탕 4.5:1 이상 */
  --f:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
  --pad:max(18px,5vw);
  --head:60px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:clip}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.75;
  font-weight:400;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
ul{list-style:none}
:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- 머리: 모바일은 위쪽 한 줄, 노트북은 왼쪽에 고정 ---------- */
.site{position:sticky;top:0;z-index:50;height:var(--head);padding:0 var(--pad);
  display:flex;align-items:center;justify-content:space-between;background:var(--bg)}
body.is-home .site{position:fixed;left:0;right:0;background:transparent}
.logo{font-size:13px;font-weight:600;letter-spacing:.18em;white-space:nowrap}
.burger{position:relative;width:26px;height:44px;margin-right:-4px}
.burger span{position:absolute;left:0;right:0;height:1.5px;background:var(--ink);transition:transform .3s var(--ease),opacity .2s}
.burger span:nth-child(1){top:16px}.burger span:nth-child(2){top:21px}.burger span:nth-child(3){top:26px}
body.menu-open .burger span:nth-child(1){transform:translateY(5px) rotate(45deg)}
body.menu-open .burger span:nth-child(2){opacity:0}
body.menu-open .burger span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
.nav{position:fixed;inset:var(--head) 0 0 0;background:var(--bg);padding:28px var(--pad);
  opacity:0;visibility:hidden;transition:opacity .3s var(--ease),visibility .3s}
body.menu-open .nav{opacity:1;visibility:visible}
.nav > ul > li{margin-bottom:18px}
.nav a{font-size:20px;letter-spacing:.12em;font-weight:500}
.nav .sub{margin:10px 0 4px 2px}
.nav .sub a{font-size:15px;letter-spacing:.04em;font-weight:400;color:var(--soft);line-height:2.2}
.nav a.on{color:var(--ink)}

/* ---------- 본문 ---------- */
main{padding:8px var(--pad) 0}
.view{animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.cats{display:flex;flex-wrap:wrap;gap:6px 22px;margin:4px 0 36px;font-size:12px;letter-spacing:.1em}
.cats a{color:var(--mute);padding:6px 0}
.cats a.on{color:var(--ink)}

/* 등장 효과: 스크립트가 있을 때만 숨긴다 */
html.js .fi{opacity:0;transform:translateY(14px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
html.js .fi.in{opacity:1;transform:none}

/* 사진 위에 마우스: 투명도만 살짝 */
.ph{display:block;width:100%;cursor:pointer}
.ph img{width:100%;height:auto;transition:opacity .4s var(--ease)}
@media (hover:hover){
  .ph:hover img,.hov:hover .ph img{opacity:.5}
  .tl:hover{opacity:.5}
}

/* HOME: 화면 전체에 사진, 흰 배경 사진과 바탕이 이어진다 */
.home{position:fixed;inset:0;z-index:0}
.slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--head) + 12px) var(--pad) 40px;opacity:0;transition:opacity 1.2s var(--ease)}
.slide.on{opacity:1}
.slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;user-select:none;-webkit-user-drag:none}

/* WORKS: 한 줄로 이어지는 작품 */
.works{display:flex;flex-direction:column;gap:80px}
.work figcaption{margin-top:14px;font-size:12.5px;line-height:1.76;letter-spacing:.02em;color:var(--soft)}
.work .tl{display:inline;font-size:13.5px;font-weight:500;color:var(--ink);letter-spacing:.01em;transition:opacity .35s var(--ease)}
.work .meta{display:block}
.work .cnt{display:block;color:var(--mute);margin-top:4px}

/* EXHIBITIONS 목록: 같은 비율의 사진, 아래로 이어지는 스크롤 */
.exlist{display:flex;flex-direction:column;gap:80px}
.ex .frame{aspect-ratio:3/2;overflow:hidden;background:#f4f4f2}
.ex .frame img{width:100%;height:100%;object-fit:cover}
.ex .cap{margin-top:14px;font-size:12.5px;line-height:1.76;letter-spacing:.02em;color:var(--soft)}
.ex .ty{display:block;color:var(--mute)}
.ex .ti{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.ex .ti .en{font-weight:400;color:var(--soft)}
.empty{color:var(--mute)}

/* 전시 상세 */
.back{display:inline-block;font-size:12px;letter-spacing:.1em;color:var(--mute);padding:6px 0;margin-bottom:20px}
.back:hover{color:var(--ink)}
.exd .head{margin:22px 0 0}
.exd .ty{color:var(--mute);font-size:12.5px}
.exd h1{font-size:20px;font-weight:500;line-height:1.5;margin-top:4px;text-wrap:balance}
.exd .ten{font-size:14px;color:var(--soft);margin-top:2px}
.exd .sub{font-size:13px;color:var(--soft);margin-top:6px}
.exd .info{margin-top:18px;font-size:13px;line-height:1.9;color:var(--soft)}
.langs{display:flex;gap:16px;margin:30px 0 12px;font-size:12px;letter-spacing:.12em}
.langs button{color:var(--mute);padding:6px 0}
.langs button.on{color:var(--ink);text-decoration:underline;text-underline-offset:5px}
.text{font-size:14px;line-height:1.95;color:var(--soft)}
.text p + p{margin-top:1.1em}
.exd .text{margin-top:30px}
.langs + .text{margin-top:0}
.poster{width:62%;margin-top:48px}
.shots{display:flex;flex-direction:column;gap:40px;margin-top:64px}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:10%;row-gap:32px;padding:0 5%}
.pair .frame{aspect-ratio:4/5;overflow:hidden;background:#f4f4f2}
.pair .frame img{width:100%;height:100%;object-fit:cover}
.pair .pc{margin-top:10px;font-size:11.5px;line-height:1.7;color:var(--soft);white-space:pre-line}

/* ABOUT */
.about .langs{margin-top:28px}
.about h2{font-size:12px;font-weight:500;letter-spacing:.12em;color:var(--mute);margin:44px 0 14px}
.about .note{max-width:640px}
.cv ul li{display:flex;gap:18px;padding:5px 0;font-size:13.5px;color:var(--soft);line-height:1.7}
.cv ul li b{flex:none;min-width:40px;font-weight:500;color:var(--ink)}

/* CONTACT */
.contact .row{display:flex;flex-wrap:wrap;gap:4px 24px;padding:10px 0;font-size:14px}
.contact .k{min-width:110px;font-size:12px;letter-spacing:.12em;color:var(--mute);padding-top:1px}
.contact a:hover{text-decoration:underline;text-underline-offset:4px}

/* 하단 */
footer{padding:120px var(--pad) 48px;font-size:11.5px;color:var(--mute);line-height:1.9}
footer .row{display:flex;align-items:center;gap:18px;margin-bottom:10px;color:var(--ink)}
footer svg{width:19px;height:19px;display:block}
footer a{color:var(--soft)}
footer a:hover{color:var(--ink)}
body.is-home footer{display:none}

/* 크게 보기: 옆으로 넘기는 사진 */
.gal{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.g-top{flex:none;height:var(--head);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad)}
.g-count{font-size:12px;letter-spacing:.12em;color:var(--mute)}
.g-close{width:44px;height:44px;margin-right:-12px;display:flex;align-items:center;justify-content:center}
.g-close svg,.g-arrow svg{width:22px;height:22px}
.g-track{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;overscroll-behavior-x:contain}
.g-track::-webkit-scrollbar{display:none}
.g-slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;padding:0 var(--pad)}
.g-slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.g-cap{flex:none;width:100%;max-width:680px;margin:0 auto;max-height:34svh;overflow:auto;
  padding:18px var(--pad) calc(22px + env(safe-area-inset-bottom));font-size:12.5px;line-height:1.8;color:var(--soft)}
.g-cap b{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.g-cap .text{font-size:13px;margin-top:12px}
.g-arrow{position:absolute;top:50%;transform:translateY(-50%);width:56px;height:56px;display:none;align-items:center;justify-content:center;color:var(--soft)}
.g-arrow:hover{color:var(--ink)}
.g-prev{left:8px}.g-next{right:8px}
@media (hover:hover) and (pointer:fine){ .gal.multi .g-arrow{display:flex} }

@media (min-width:600px) and (max-width:959px){
  .burger{display:none}
  .nav{position:static;inset:auto;opacity:1;visibility:visible;background:none;padding:0}
  .nav > ul{display:flex;gap:22px}
  .nav > ul > li{margin:0}
  .nav a{font-size:12px;letter-spacing:.14em}
  .nav .sub{display:none}
  body.has-view .nav a{color:var(--mute)}
  body.has-view .nav a.on{color:var(--ink)}
  .site{height:72px}
}
/* ---------- 노트북·데스크톱: 메뉴 왼쪽, 작품 오른쪽 한 줄 ---------- */
@media (min-width:960px){
  :root{--pad:7.5vw}
  .site,body.is-home .site{position:fixed;top:0;left:0;bottom:0;right:auto;width:30vw;height:auto;
    padding:50px 0 0 var(--pad);display:block;background:transparent}
  .burger{display:none}
  .nav{position:static;inset:auto;opacity:1;visibility:visible;background:none;padding:0;margin-top:30px}
  .nav > ul > li{margin-bottom:2px}
  .nav a{font-size:12px;letter-spacing:.14em;line-height:2.1;transition:opacity .25s}
  .nav a:hover{opacity:.4}
  .nav .sub{display:none;margin:2px 0 8px 12px}
  .nav .sub a{font-size:12px;letter-spacing:.04em;line-height:2}
  body.in-works .nav .sub{display:block}
  body.has-view .nav a{color:var(--mute)}
  body.has-view .nav a.on{color:var(--ink)}
  main,footer{margin-left:50vw;width:clamp(400px,35vw,640px);padding-left:0;padding-right:0}
  main{padding-top:50px}
  .cats{display:none}
  .works,.exlist{gap:112px}
  .shots{gap:56px}
  .slide{padding:0}
  .back{display:none}
  footer{padding-top:160px}
  .g-slide{padding:0 9vw}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html.js .fi{opacity:1;transform:none}
}
</style>
</head>
<body>

<header class="site">
  <a class="logo" href="#/">KIM JI HYUN</a>
  <button class="burger" id="burger" aria-label="메뉴 열기" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
  <nav class="nav" id="nav" aria-label="주 메뉴">
    <ul>
      <li><a href="#/about" data-k="about">ABOUT</a></li>
      <li><a href="#/works/objects" data-k="works">WORKS</a>
        <ul class="sub" id="navSub"></ul>
      </li>
      <li><a href="#/exhibitions" data-k="exhibitions">EXHIBITIONS</a></li>
      <li><a href="#/contact" data-k="contact">CONTACT</a></li>
    </ul>
  </nav>
</header>

<main>
  <section class="view home" id="v-home" aria-label="대표 작품"></section>

  <section class="view" id="v-works" hidden>
    <div class="cats" id="cats"></div>
    <div class="works" id="worksList"></div>
  </section>

  <section class="view" id="v-exhibitions" hidden>
    <div class="exlist" id="exList"></div>
  </section>

  <section class="view exd" id="v-exhibition" hidden></section>

  <section class="view about" id="v-about" hidden>
    <img id="aboutImg" alt="김지현 작업실">
    <div class="langs" id="aboutLangs">
      <button data-lang="ko">KO</button><button data-lang="en">EN</button>
    </div>
    <div id="aboutBody"></div>
  </section>

  <section class="view contact" id="v-contact" hidden>
    <div class="row"><span class="k">EMAIL</span><a id="mail" href="#">&nbsp;</a></div>
    <div class="row"><span class="k">INSTAGRAM</span><a id="insta" href="#" target="_blank" rel="noopener">&nbsp;</a></div>
  </section>
</main>

<footer>
  <div class="row">
    <span>&copy; 2026 KIM JI HYUN</span>
    <a id="footInsta" href="#" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg>
    </a>
    <a id="footMail" href="#" aria-label="이메일 보내기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.2"/><path d="M3.6 6.6 L12 12.6 L20.4 6.6"/></svg>
    </a>
  </div>
  <p>본 사이트의 모든 작품 이미지와 글은 작가에게 저작권이 있으며 무단 사용을 금합니다.<br>
  Unauthorized use of any image or text on this site is prohibited.</p>
</footer>

<div class="gal" id="gal" role="dialog" aria-modal="true" aria-label="크게 보기" hidden>
  <div class="g-top">
    <span class="g-count" id="gCount"></span>
    <button class="g-close" id="gClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </div>
  <div class="g-track" id="gTrack"></div>
  <button class="g-arrow g-prev" id="gPrev" aria-label="이전 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M15 4l-8 8 8 8"/></svg></button>
  <button class="g-arrow g-next" id="gNext" aria-label="다음 사진"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M9 4l8 8-8 8"/></svg></button>
  <div class="g-cap" id="gCap"></div>
</div>

<script>
/* 내용은 content/site.json 에서 불러온다(관리 화면 /admin 이 편집). 코드에는 구조와 라벨만 둔다. */
(async () => {
let SITE;
try { SITE = await (await fetch('content/site.json?_=' + Date.now())).json(); }
catch (e) { console.error('content/site.json 을 불러오지 못했습니다.', e); return; }

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const url = p => esc(encodeURI(p || ''));
const paras = t => String(t || '').trim().split(/\n\s*\n/).filter(Boolean)
  .map(p => `<p>${esc(p.trim()).replace(/\n/g, '<br>')}</p>`).join('');
const img = (src, alt, eager) => `<img src="${url(src)}" alt="${esc(alt)}" ${eager ? '' : 'loading="lazy"'} decoding="async" onerror="this.closest('[data-hide-broken]')?.remove()">`;

const CATS = [
  { id: 'objects', label: 'Objects' },
  { id: 'hap',     label: 'Hap Series' },
  { id: 'tangram', label: 'Tangram Series' }
];
const TYPE_EN = { '개인전': 'Solo Exhibition', '단체전': 'Group Exhibition', '아트페어': 'Art Fair' };
const CV_LABELS = {
  ko: { note: '작가노트', solo: '개인전', group: '단체전', awards: '수상' },
  en: { note: 'Artist Note', solo: 'Solo Exhibitions', group: 'Group Exhibitions', awards: 'Award' }
};

const WORKS = SITE.works;
const yearOf = n => n.year || ((n.period || '').match(/\d{4}/) || [''])[0];
/* 전시 목록: 연도가 최근인 순서. 같은 해는 관리 화면 순서를 지킨다 */
const EXH = SITE.news.items.map((n, i) => ({ ...n, _i: i }))
  .sort((a, b) => (yearOf(b) || 0) - (yearOf(a) || 0) || a._i - b._i);
const coverOf = n => n.cover || (n.photos || [])[0] || n.poster;

/* ---------- 메뉴 ---------- */
$('#navSub').innerHTML = CATS.map(c => `<li><a href="#/works/${c.id}" data-k="${c.id}">${c.label}</a></li>`).join('');
$('#cats').innerHTML = CATS.map(c => `<a href="#/works/${c.id}" data-k="${c.id}">${c.label.toUpperCase()}</a>`).join('');
const burger = $('#burger');
const setMenu = on => { document.body.classList.toggle('menu-open', on); burger.setAttribute('aria-expanded', on); burger.setAttribute('aria-label', on ? '메뉴 닫기' : '메뉴 열기'); };
burger.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));

/* ---------- 등장 효과 ---------- */
const io = 'IntersectionObserver' in window
  ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' })
  : null;
const watch = root => root.querySelectorAll('.fi').forEach(el => io ? io.observe(el) : el.classList.add('in'));

/* ---------- 크게 보기 (옆으로 넘기기) ---------- */
const gal = $('#gal'), gTrack = $('#gTrack'), gCap = $('#gCap'), gCount = $('#gCount');
let gItems = [], gIdx = 0, gLastFocus = null;
function gShow(i) {
  gIdx = Math.max(0, Math.min(gItems.length - 1, i));
  gCap.innerHTML = gItems[gIdx].cap || '';
  gCount.textContent = gItems.length > 1 ? `${gIdx + 1} / ${gItems.length}` : '';
}
function openGal(items, i) {
  gItems = items; gLastFocus = document.activeElement;
  gTrack.innerHTML = items.map((it, k) => `<div class="g-slide">${img(it.src, it.alt || '', Math.abs(k - i) < 2)}</div>`).join('');
  gal.classList.toggle('multi', items.length > 1);
  gal.hidden = false; document.documentElement.style.overflow = 'hidden';
  gTrack.scrollLeft = i * gTrack.clientWidth; gShow(i);
  history.pushState({ gal: 1 }, '');
  $('#gClose').focus();
}
function closeGal(fromPop) {
  if (gal.hidden) return;
  gal.hidden = true; document.documentElement.style.overflow = '';
  gTrack.innerHTML = '';
  if (!fromPop && history.state && history.state.gal) history.back();
  gLastFocus && gLastFocus.focus({ preventScroll: true });
}
const gStep = d => gTrack.scrollTo({ left: (gIdx + d) * gTrack.clientWidth, behavior: 'smooth' });
let gTick;
gTrack.addEventListener('scroll', () => { cancelAnimationFrame(gTick); gTick = requestAnimationFrame(() => gShow(Math.round(gTrack.scrollLeft / gTrack.clientWidth))); }, { passive: true });
$('#gClose').onclick = () => closeGal();
$('#gPrev').onclick = () => gStep(-1);
$('#gNext').onclick = () => gStep(1);
window.addEventListener('popstate', () => closeGal(true));
document.addEventListener('keydown', e => {
  if (gal.hidden) return;
  if (e.key === 'Escape') closeGal();
  if (e.key === 'ArrowLeft') gStep(-1);
  if (e.key === 'ArrowRight') gStep(1);
});
window.addEventListener('resize', () => { if (!gal.hidden) gTrack.scrollLeft = gIdx * gTrack.clientWidth; });

/* ---------- HOME ---------- */
const home = $('#v-home');
home.innerHTML = SITE.home.images.map((s, i) => `<div class="slide${i ? '' : ' on'}">${img(s, 'KIM JI HYUN 작품', i === 0)}</div>`).join('');
const slides = [...home.children];
let hIdx = 0, hTimer = null;
const hGo = i => { slides[hIdx].classList.remove('on'); hIdx = (i + slides.length) % slides.length; slides[hIdx].classList.add('on'); };
const reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
const hPlay = on => { clearInterval(hTimer); if (on && !reduce && slides.length > 1) hTimer = setInterval(() => hGo(hIdx + 1), 5000); };
let hx = null;
home.addEventListener('pointerdown', e => { hx = e.clientX; });
home.addEventListener('pointerup', e => {
  if (hx === null) return; const dx = e.clientX - hx; hx = null;
  if (Math.abs(dx) > 40) { hGo(hIdx + (dx < 0 ? 1 : -1)); hPlay(true); }
});

/* ---------- WORKS ---------- */
function workCap(w) {
  const spec = [w.mat, w.size, w.year].filter(Boolean).map(esc).join('<br>');
  return (w.title ? `<b>${esc(w.title)}</b>` : '') + (spec ? `<span>${spec}</span>` : '') + (w.desc ? `<div class="text">${paras(w.desc)}</div>` : '');
}
function renderWorks(cat) {
  const list = WORKS[cat] || [];
  $('#worksList').innerHTML = list.map((w, i) => {
    const n = 1 + (w.images || []).length;
    const spec = [w.year, w.mat, w.size].filter(Boolean).map(esc).join('<br>');
    return `<figure class="work fi" data-hide-broken>
      <div class="hov"><button class="ph" data-w="${i}" aria-label="${esc(w.title || '작품')} 크게 보기">${img(w.img, w.title || `작품 ${i + 1}`, i === 0)}</button>
      <figcaption>${w.title ? `<button class="tl" data-w="${i}">${esc(w.title)}</button>` : ''}
        ${spec ? `<span class="meta">${spec}</span>` : ''}
        ${n > 1 ? `<span class="cnt">${n} images</span>` : ''}</figcaption></div>
    </figure>`;
  }).join('');
  $('#worksList').onclick = e => {
    const b = e.target.closest('[data-w]'); if (!b) return;
    const w = list[+b.dataset.w], cap = workCap(w);
    openGal([w.img, ...(w.images || [])].map(src => ({ src, alt: w.title, cap })), 0);
  };
  watch($('#worksList'));
}

/* ---------- EXHIBITIONS ---------- */
function exTitle(n) { return `${esc(n.title)}${n.titleEn ? ` <span class="en">${esc(n.titleEn)}</span>` : ''}`; }
function renderExList() {
  $('#exList').innerHTML = EXH.length ? EXH.map((n, k) => `
    <a class="ex fi hov" href="#/exhibitions/${n._i}">
      <div class="ph frame">${img(coverOf(n), n.title, k === 0)}</div>
      <p class="cap"><span class="ty">${esc(TYPE_EN[n.type] || n.type || '')}</span>
        <span class="ti">${exTitle(n)}${yearOf(n) ? `, ${esc(yearOf(n))}` : ''}</span>
        <span>${esc(n.place || n.venue || '')}</span></p>
    </a>`).join('') : '<p class="empty">등록된 전시가 아직 없습니다.</p>';
  watch($('#exList'));
}
function renderEx(i) {
  const n = SITE.news.items[i], box = $('#v-exhibition');
  if (!n) { location.hash = '#/exhibitions'; return; }
  const cover = coverOf(n);
  const g = []; /* 이 화면의 모든 사진을 화면 순서대로 크게 보기에 넣는다 */
  const add = (src, cap, alt) => { g.push({ src, cap: cap ? `<div class="text">${paras(cap)}</div>` : '', alt }); return g.length - 1; };
  const shot = src => `<button class="ph fi" data-g="${add(src, '', n.title + ' 전시 전경')}" data-hide-broken>${img(src, n.title + ' 전시 전경')}</button>`;
  const piece = w => `<figure class="fi" data-hide-broken><button class="ph frame" data-g="${add(w.img, w.cap, w.cap || n.title)}">${img(w.img, w.cap || n.title)}</button>${w.cap ? `<figcaption class="pc">${esc(w.cap)}</figcaption>` : ''}</figure>`;

  const coverIdx = add(cover, '', n.title);
  const info = [n.period, n.closed, n.hours, n.venue].filter(Boolean).map(esc).join('<br>');
  const hasEn = !!(n.textEn && n.textEn.trim()), hasKo = !!(n.text && n.text.trim());
  const posterIdx = n.poster && n.poster !== cover ? add(n.poster, '', n.title + ' 포스터') : -1;

  const photos = (n.photos || []).filter(p => p !== cover);
  const works = (n.works || []).filter(w => w && w.img);
  let body = '', wi = 0;
  photos.forEach(p => {
    body += shot(p);
    if (wi < works.length) { body += `<div class="pair">${works.slice(wi, wi + 2).map(piece).join('')}</div>`; wi += 2; }
  });
  for (; wi < works.length; wi += 2) body += `<div class="pair">${works.slice(wi, wi + 2).map(piece).join('')}</div>`;

  box.innerHTML = `
    <a class="back" href="#/exhibitions">EXHIBITIONS</a>
    <button class="ph" data-g="${coverIdx}">${img(cover, n.title, true)}</button>
    <div class="head">
      <p class="ty">${esc(TYPE_EN[n.type] || n.type || '')}</p>
      <h1>${esc(n.title)}</h1>
      ${n.titleEn ? `<p class="ten">${esc(n.titleEn)}</p>` : ''}
      ${n.sub ? `<p class="sub">${esc(n.sub)}</p>` : ''}
      ${info ? `<p class="info">${info}</p>` : ''}
    </div>
    ${hasEn && hasKo ? `<div class="langs" id="exLangs"><button data-lang="en">EN</button><button data-lang="ko" class="on">KO</button></div>` : ''}
    ${hasKo || hasEn ? `<div class="text" id="exText" lang="${hasKo ? 'ko' : 'en'}">${paras(hasKo ? n.text : n.textEn)}</div>` : ''}
    ${posterIdx >= 0 ? `<button class="ph poster" data-g="${posterIdx}" data-hide-broken>${img(n.poster, n.title + ' 포스터')}</button>` : ''}
    ${body ? `<div class="shots">${body}</div>` : ''}`;

  box.onclick = e => {
    const lb = e.target.closest('#exLangs button');
    if (lb) {
      const l = lb.dataset.lang, t = $('#exText');
      t.innerHTML = paras(l === 'en' ? n.textEn : n.text); t.lang = l;
      box.querySelectorAll('#exLangs button').forEach(b => b.classList.toggle('on', b === lb));
      return;
    }
    const b = e.target.closest('[data-g]'); if (b) openGal(g, +b.dataset.g);
  };
  watch(box);
}

/* ---------- ABOUT ---------- */
let aboutLang = 'ko';
function renderAbout(lang) {
  aboutLang = lang;
  const d = SITE.about.cv[lang] || {}, L = CV_LABELS[lang];
  const ai = $('#aboutImg');
  ai.hidden = false; ai.onerror = () => { ai.hidden = true; };
  ai.src = encodeURI(lang === 'en' ? SITE.about.imageEn : SITE.about.imageKo);
  const block = k => d[k] && d[k].length ? `<h2>${L[k]}</h2><ul>${d[k].map(r => `<li><b>${esc(r.year)}</b><span>${esc(r.text)}</span></li>`).join('')}</ul>` : '';
  $('#aboutBody').innerHTML =
    (d.statement && d.statement.trim() ? `<h2>${L.note}</h2><div class="text note" lang="${lang}">${paras(d.statement)}</div>` : '') +
    `<div class="cv">${['solo', 'group', 'awards'].map(block).join('')}</div>`;
  document.querySelectorAll('#aboutLangs button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
}
$('#aboutLangs').onclick = e => { const b = e.target.closest('button'); if (b) renderAbout(b.dataset.lang); };

/* ---------- CONTACT (이메일은 조각으로 합쳐 스팸 수집 방지) ---------- */
const C = SITE.settings, mailAddr = C.emailUser + '@' + C.emailDomain;
$('#mail').textContent = mailAddr; $('#mail').href = 'mail' + 'to:' + mailAddr;
$('#insta').textContent = C.instaHandle; $('#insta').href = C.insta;
$('#footInsta').href = C.insta; $('#footMail').href = 'mail' + 'to:' + mailAddr;

/* ---------- 주소(#/...)에 따라 화면 전환: 뒤로 가기가 그대로 동작한다 ---------- */
const scrollMem = {};
let curKey = null;
function route() {
  const parts = (location.hash.replace(/^#\/?/, '') || '').split('/').filter(Boolean);
  let [page = 'home', arg] = parts;
  if (page === 'news') page = 'exhibitions';
  let view = page, key;
  if (page === 'works') { arg = CATS.some(c => c.id === arg) ? arg : 'objects'; key = 'works/' + arg; }
  else if (page === 'exhibitions' && arg !== undefined) { view = 'exhibition'; key = 'exhibition/' + arg; }
  else if (page === 'about') { arg = arg === 'en' ? 'en' : (arg === 'ko' ? 'ko' : aboutLang); key = 'about'; }
  else if (!['home', 'exhibitions', 'contact'].includes(page)) { view = page = 'home'; key = 'home'; }
  else key = page;
  if (key === curKey) return;
  if (curKey) scrollMem[curKey] = scrollY;
  curKey = key;

  closeGal(true); setMenu(false);
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'v-' + view; });
  document.body.classList.toggle('is-home', view === 'home');
  document.body.classList.toggle('has-view', view !== 'home');
  document.body.classList.toggle('in-works', page === 'works');
  hPlay(view === 'home');

  if (page === 'works') renderWorks(arg);
  if (view === 'exhibitions') renderExList();
  if (view === 'exhibition') renderEx(+arg);
  if (page === 'about') renderAbout(arg);

  const navKey = page === 'works' ? 'works' : page;
  document.querySelectorAll('.nav a, .cats a').forEach(a => a.classList.toggle('on', a.dataset.k === navKey || (page === 'works' && a.dataset.k === arg)));
  document.querySelectorAll('.nav a, .cats a').forEach(a => a.classList.contains('on') ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  requestAnimationFrame(() => scrollTo(0, scrollMem[key] || 0));
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
